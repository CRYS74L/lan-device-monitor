<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><title>局域网设备助手</title><link rel="apple-touch-icon" href="/icon.png"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body>
<header><div class="brand"><img src="/icon.png" alt="" width="36" height="36"><div><strong>局域网设备助手</strong><small>你的网络，一目了然</small></div></div><nav aria-label="主导航"><button class="active" data-page="devices">设备</button><button data-page="router">路由器</button></nav></header>
<div id="status" role="status">正在连接…</div>
<main>
<section id="devices" class="page"><div class="page-heading"><div><span class="eyebrow">NETWORK OVERVIEW</span><h1>我的设备</h1></div><span id="count" class="badge">等待数据</span></div><div class="workspace"><aside id="device-list-panel" class="panel"><label class="search-label" for="search">查找设备</label><input id="search" type="search" placeholder="名称、IP 或 MAC"><div class="filters" aria-label="设备筛选"><button data-filter="all" class="active">全部</button><button data-filter="online">在线</button><button data-filter="offline">离线</button></div><div id="device-list"></div></aside><article id="detail" class="panel"><p class="empty">选择一台设备，查看连接与流量信息。</p></article></div></section>
<section id="router" class="page" hidden><div class="page-heading"><div><span class="eyebrow">GATEWAY</span><h1>路由器与网络</h1></div></div><div id="router-content" class="router-grid"></div></section>
</main><footer>局域网直连 · 电脑端持续监控</footer>
</body></html>
